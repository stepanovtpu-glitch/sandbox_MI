server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Загрузка PDF-сканов МИ может быть крупной
  client_max_body_size 100m;

  # Файлы сборки имеют хеш в имени — их можно кешировать надолго
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html кешировать нельзя: иначе после обновления версии
  # пользователь продолжает видеть старую сборку
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # DNS-резолвер Docker: без него nginx запоминает IP бэкенда при старте
  # и после пересоздания контейнера отдаёт 502, пока его не перезапустят.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
  }

  location /health {
    set $backend_health http://backend:8000;
    proxy_pass $backend_health;
  }
}
