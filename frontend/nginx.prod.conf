server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Загрузка PDF-сканов МИ может быть крупной
  client_max_body_size 100m;

  # Файлы сборки имеют хеш в имени — их можно кешировать надолго
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html кешировать нельзя: иначе после обновления версии
  # пользователь продолжает видеть старую сборку
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
  }

  location /health {
    proxy_pass http://backend:8000;
  }
}
