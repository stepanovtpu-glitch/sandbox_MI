# Системный nginx на VPS: сайт GasMeter Pro.
# Кладётся в /etc/nginx/sites-available/gasmeter, симлинк в sites-enabled.
# HTTPS выпускается certbot'ом отдельно (он допишет listen 443 и пути к сертификату).
server {
    listen 80;
    server_name gasmeter.77-95-203-87.sslip.io;

    # Загрузка PDF-сканов МИ бывает крупной
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
