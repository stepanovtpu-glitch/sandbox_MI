# GasMeter Pro — производственный запуск.
# Наружу порт не публикуется: доступ идёт через системный nginx
# (gasmeter.77-95-203-87.sslip.io → 127.0.0.1:8090).
# База — собственный экземпляр PostgreSQL: соседние сервисы на этом сервере
# используют свои базы, и смешивать их не следует.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=gasmeter
      - POSTGRES_USER=gasmeter
      - POSTGRES_PASSWORD=${GASMETER_DB_PASSWORD:?требуется GASMETER_DB_PASSWORD в .env}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gasmeter -d gasmeter']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: gasmeter-backend:latest
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - GASMETER_DB_DIR=/app/data
      # На сервере вход обязателен: роль определяется сессией, а не заголовком запроса
      - GASMETER_REQUIRE_AUTH=1
      # Корпоративная LLM — Ollama внутри периметра ИНК (пример: http://10.61.157.1:11434,
      # модель gemma4:e4b). Пусто — модуль отключён. Со стенда в интернете модель
      # недоступна, включается на развёртывании внутри сети («Архимед»).
      - GASMETER_LLM_BASE_URL=${GASMETER_LLM_BASE_URL:-}
      - GASMETER_LLM_PROVIDER=${GASMETER_LLM_PROVIDER:-auto}
      - GASMETER_LLM_MODEL=${GASMETER_LLM_MODEL:-}
      - GASMETER_LLM_API_KEY=${GASMETER_LLM_API_KEY:-}
      # Яндекс Мессенджер — уведомления о согласовании проектов. Пусто — отключено.
      - GASMETER_YM_TOKEN=${GASMETER_YM_TOKEN:-}
      - GASMETER_YM_CHAT_ID=${GASMETER_YM_CHAT_ID:-}
      - GASMETER_YM_LOGIN=${GASMETER_YM_LOGIN:-}
      - GASMETER_DATABASE_URL=postgresql://gasmeter:${GASMETER_DB_PASSWORD}@postgres:5432/gasmeter
    volumes:
      - ./data:/app/data
      - ./mi_library:/app/mi_library
    depends_on:
      postgres:
        condition: service_healthy

  messenger-bot:
    image: gasmeter-backend:latest
    profiles: ["messenger"]
    restart: unless-stopped
    command: ["python", "-m", "app.messenger_bot"]
    environment:
      - PYTHONUNBUFFERED=1
      - GASMETER_DB_DIR=/app/data
      - GASMETER_DATABASE_URL=postgresql://gasmeter:${GASMETER_DB_PASSWORD}@postgres:5432/gasmeter
      - GASMETER_YM_TOKEN=${GASMETER_YM_TOKEN:-}
      - GASMETER_YM_USER_MAP=${GASMETER_YM_USER_MAP:-}
      - GASMETER_LLM_BASE_URL=${GASMETER_LLM_BASE_URL:-}
      - GASMETER_LLM_PROVIDER=${GASMETER_LLM_PROVIDER:-auto}
      - GASMETER_LLM_MODEL=${GASMETER_LLM_MODEL:-}
      - GASMETER_LLM_API_KEY=${GASMETER_LLM_API_KEY:-}
      - GASMETER_MI_LIBRARY_DIR=/app/mi_library
    volumes:
      - ./data:/app/data
      - ./mi_library:/app/mi_library:ro
    depends_on:
      postgres:
        condition: service_healthy

  arshin-checker:
    image: gasmeter-backend:latest
    restart: unless-stopped
    command: ["python", "-m", "app.arshin_checker"]
    environment:
      - PYTHONUNBUFFERED=1
      - GASMETER_DB_DIR=/app/data
      - GASMETER_DATABASE_URL=postgresql://gasmeter:${GASMETER_DB_PASSWORD}@postgres:5432/gasmeter
      - GASMETER_ARSHIN_WORKER_INTERVAL_SECONDS=${GASMETER_ARSHIN_WORKER_INTERVAL_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: gasmeter-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - backend
